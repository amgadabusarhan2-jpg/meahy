<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>رمز التحقق</title>
  <style>
    body { font-family: Tahoma, sans-serif; direction: rtl; background: #f4f4f4; }
    .container { width: 350px; margin: 50px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px #ccc; text-align: center; }
    h2 { color: #0077b6; }
    .otp-inputs { display: flex; justify-content: space-between; margin-top: 20px; }
    .otp-inputs input { width: 40px; height: 40px; text-align: center; font-size: 18px; border: 1px solid #ccc; border-radius: 4px; }
    .btn { width: 100%; padding: 10px; margin-top: 20px; background: #0077b6; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #023e8a; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔐 أدخل رمز التحقق</h2>
    <p>تم إرسال رمز مكون من 6 أرقام إلى هاتفك</p>
    <form id="otpForm">
      <div class="otp-inputs">
        <input type="text" maxlength="1">
        <input type="text" maxlength="1">
        <input type="text" maxlength="1">
        <input type="text" maxlength="1">
        <input type="text" maxlength="1">
        <input type="text" maxlength="1">
      </div>
      <button type="submit" class="btn">تأكيد</button>
    </form>
  </div>

  <script>
    const inputs = document.querySelectorAll(".otp-inputs input");
    inputs.forEach((input, index) => {
      input.addEventListener("keyup", (e) => {
        if (e.key >= "0" && e.key <= "9") {
          if (index < inputs.length - 1) inputs[index + 1].focus();
        } else if (e.key === "Backspace" && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    document.getElementById("otpForm").addEventListener("submit", function(e) {
      e.preventDefault();
      let code = "";
      inputs.forEach(input => code += input.value);
      if (code.length !== 6) {
        alert("⚠️ الرجاء إدخال الرمز كاملاً (6 أرقام)");
        return;
      }
      alert("✅ تم التحقق من الرمز بنجاح (تجريبي)");
    });
  </script>
</body>
</html>
