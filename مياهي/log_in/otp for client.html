<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>رمز التحقق - العملاء</title>
  <style>
    body { font-family: Tahoma, sans-serif; direction: rtl; background: #f4f4f4; }
    .container { width: 350px; margin: 50px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px #ccc; text-align: center; }
    h2 { color: #0077b6; }
    .otp-inputs { display: flex; justify-content: space-between; margin-top: 20px; direction: ltr; }
    .otp-inputs input { width: 40px; height: 40px; text-align: center; font-size: 18px; border: 1px solid #ccc; border-radius: 4px; }
    .btn { width: 100%; padding: 10px; margin-top: 20px; background: #0077b6; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #023e8a; }
    .note { margin-top: 15px; font-size: 14px; color:#555; }
    .hidden { display: none; }
    input[type="password"] { width: 100%; padding: 8px; margin-top: 10px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔐 أدخل رمز التحقق</h2>
    <p>تم إرسال رمز مكون من 6 أرقام إلى هاتفك</p>
    <form id="otpForm">
      <div class="otp-inputs">
        <input type="text" maxlength="1">
        <input type="text" maxlength="1">
        <input type="text" maxlength="1">
        <input type="text" maxlength="1">
        <input type="text" maxlength="1">
        <input type="text" maxlength="1">
      </div>
      <button type="submit" class="btn">تأكيد</button>
    </form>

    <!-- نموذج إعادة تعيين كلمة المرور -->
    <form id="resetForm" class="hidden">
      <h2>🔑 إعادة تعيين كلمة المرور</h2>
      <input type="password" id="newPassword" placeholder="أدخل كلمة المرور الجديدة">
      <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور">
      <button type="submit" class="btn">حفظ كلمة المرور</button>
    </form>

    <div class="note">
      📌 إذا لم يصلك الرمز، تأكد من رقم الهاتف أو اطلب إعادة الإرسال من الدعم.
    </div>
  </div>

  <script>
    const inputs = document.querySelectorAll(".otp-inputs input");
    inputs.forEach((input, index) => {
      input.addEventListener("keyup", (e) => {
        if (e.key >= "0" && e.key <= "9") {
          if (index < inputs.length - 1) inputs[index + 1].focus();
        } else if (e.key === "Backspace" && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    // التحقق من الرمز
    document.getElementById("otpForm").addEventListener("submit", function(e) {
      e.preventDefault();
      let code = "";
      inputs.forEach(input => code += input.value);
      if (code.length !== 6) {
        alert("⚠️ الرجاء إدخال الرمز كاملاً (6 أرقام)");
        return;
      }
      alert("✅ تم التحقق من الرمز بنجاح");
      // إظهار نموذج إعادة تعيين كلمة المرور
      document.getElementById("otpForm").classList.add("hidden");
      document.getElementById("resetForm").classList.remove("hidden");
    });

    // إعادة تعيين كلمة المرور
    document.getElementById("resetForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const newPassword = document.getElementById("newPassword").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();

      if (newPassword === "" || confirmPassword === "") {
        alert("⚠️ الرجاء إدخال كلمة المرور الجديدة وتأكيدها");
        return;
      }
      if (newPassword !== confirmPassword) {
        alert("⚠️ كلمة المرور غير متطابقة");
        return;
      }

      alert("✅ تم تغيير كلمة المرور بنجاح، الرجاء تسجيل الدخول مجدداً");
      // بعد الحفظ → الانتقال لصفحة تسجيل الدخول الخاصة بالعملاء
      window.location.href = "file:///C:/Users/amjad/مياهي/log_in/login.html";
    });
  </script>
</body>
</html>
