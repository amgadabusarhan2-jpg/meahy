<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>🔑 تسجيل الدخول</title>
  <style>
    body { font-family: Tahoma, sans-serif; direction: rtl; background:#f4f4f4; margin:0; }
    
    /* الشريط العلوي */
    .topbar {
      background:#0077b6; color:white; padding:10px; display:flex; justify-content:space-around;
      position:fixed; top:0; width:100%; z-index:1000;
    }
    .topbar a { color:white; text-decoration:none; font-weight:bold; padding:8px 12px; }
    .topbar a:hover { background:#023e8a; border-radius:4px; }
    
    /* صندوق تسجيل الدخول */
    .container {
      width: 350px; margin: 100px auto; background: white; padding: 20px;
      border-radius: 8px; box-shadow: 0 0 10px #ccc;
    }
    h2 { text-align: center; color: #0077b6; }
    label { display: block; margin-top: 10px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 8px; margin-top: 5px;
      border: 1px solid #ccc; border-radius: 4px;
    }
    .btn {
      width: 100%; padding: 10px; margin-top: 15px;
      background: #0077b6; color: white; border: none;
      border-radius: 4px; cursor: pointer;
    }
    .btn:hover { background: #023e8a; }
    .options { text-align: center; margin-top: 10px; }
    .options a { color: #0077b6; text-decoration: none; margin: 0 5px; }
  </style>
</head>
<body>

  <!-- الشريط العلوي -->
  <div class="topbar">
    <a href="file:///C:/Users/amjad/%D9%85%D9%8A%D8%A7%D9%87%D9%8A/log_in/stations%20login.html">🏪 محطة</a>
    <a href="file:///C:/Users/amjad/%D9%85%D9%8A%D8%A7%D9%87%D9%8A/log_in/Driver%20login.html">🚚 سائق</a>
  </div>

  <!-- تسجيل الدخول -->
  <div class="container">
    <h2>🔑 تسجيل الدخول</h2>
    <form id="loginForm">
      <label>رقم الهاتف:</label>
      <input type="text" id="phone" placeholder="أدخل رقم الهاتف">
      
      <label>كلمة المرور:</label>
      <input type="password" id="password" placeholder="أدخل كلمة المرور">
      
      <button type="submit" class="btn">دخول</button>
    </form>
    <div class="options">
      <a href="file:///C:/Users/amjad/%D9%85%D9%8A%D8%A7%D9%87%D9%8A/log_in/forgot%20my%20clients%20password.htm">نسيت كلمة المرور؟</a> | 
      <a href="file:///C:/Users/amjad/%D9%85%D9%8A%D8%A7%D9%87%D9%8A/log_in/Register.html">ليس لدي حساب</a>
    </div>
  </div>

  <script>
    // تحقق من القيم
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value.trim();

      if (phone === "" || password === "") {
        alert("⚠️ الرجاء تعبئة جميع الحقول");
        return;
      }
      if (!/^[0-9]{10}$/.test(phone)) {
        alert("⚠️ رقم الهاتف يجب أن يكون 10 أرقام");
        return;
      }

      alert("✅ تسجيل الدخول ناجح (تجريبي)");
         window.location.href = "file:///C:/Users/amjad/%D9%85%D9%8A%D8%A7%D9%87%D9%8A/log_in/station_selection.html";
    });
  </script>

</body>
</html>
