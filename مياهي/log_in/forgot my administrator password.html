<head>
  <meta charset="UTF-8">
  <title>نسيت كلمة المرور - المشرف</title>
  <style>
    body { font-family: Tahoma, sans-serif; direction: rtl; background:#f4f4f4; margin:0; }
    .container {
      width: 350px; margin: 80px auto; background: white; padding: 20px;
      border-radius: 8px; box-shadow: 0 0 10px #ccc;
    }
    h2 { text-align: center; color: #0077b6; }
    label { display: block; margin-top: 10px; }
    input[type="text"] {
      width: 100%; padding: 8px; margin-top: 5px;
      border: 1px solid #ccc; border-radius: 4px;
    }
    .btn {
      width: 100%; padding: 10px; margin-top: 15px;
      background: #0077b6; color: white; border: none;
      border-radius: 4px; cursor: pointer;
    }
    .btn:hover { background: #023e8a; }
    .note {
      margin-top: 15px; padding: 10px; background:#e9ecef;
      border-radius: 6px; font-size: 14px; color:#333;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🔐 نسيت كلمة المرور</h2>
    <form id="forgotForm">
      <label>أدخل رقم الهاتف المسجل:</label>
      <input type="text" id="phone" placeholder="مثال: 0791234567">

      <button type="submit" class="btn">📩 إرسال رسالة نصية</button>
    </form>

    <!-- ملاحظة -->
    <div class="note">
      📌 سيتم إرسال رسالة نصية (OTP أو رابط استعادة) إلى رقم الهاتف المدخل.  
      إذا لم يصلك شيء، تأكد أن الرقم صحيح أو تواصل مع الدعم الفني.
    </div>
  </div>

  <script>
    document.getElementById("forgotForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const phone = document.getElementById("phone").value.trim();

      if (!/^[0-9]{10}$/.test(phone)) {
        alert("⚠️ رقم الهاتف يجب أن يكون 10 أرقام");
        return;
      }

      // لاحقاً: هنا يتم ربط إرسال SMS عبر السيرفر
      alert("✅ تم إرسال رسالة نصية إلى الرقم: " + phone);
       window.location.href = "file:///C:/Users/amjad/%D9%85%D9%8A%D8%A7%D9%87%D9%8A/log_in/otp%20for%20station.html"; // مثال للانتقال لصفحة إعادة التعيين
    });
  </script>

</body>
</html>
