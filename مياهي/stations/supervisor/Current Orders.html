</style>


<div class="container">
  <h2>🚚 الطلبات الحالية</h2>
  <table id="currentOrders">
    <thead>
      <tr>
        <th>رقم الطلب</th>
        <th>اسم العميل</th>
        <th>الخدمة</th>
        <th>العدد</th>
        <th>السائق المستلم</th>
        <th>الحالة</th>
        <th>إجراء</th>
      </tr>
    </thead>
    <tbody>
      <!-- أمثلة -->
      <tr>
        <td>0</td>
        <td>أحمد</td>
        <td>تبديل عبوات</td>
        <td>2</td>
        <td>خالد</td>
        <td class="status pending">⏳ قيد التنفيذ</td>
        <td><button class="btn">تحديث الحالة</button></td>
      </tr>
      <tr>
        <td>1</td>
        <td>ليلى</td>
        <td>شراء عبوة</td>
        <td>1</td>
        <td>محمود</td>
        <td class="status onway">🚚 في الطريق</td>
        <td><button class="btn">تحديث الحالة</button></td>
      </tr>
    </tbody>
  </table>
</div>



<style>
  .status.pending { color: #ffc107; font-weight: bold; }
  .status.onway { color: #0077b6; font-weight: bold; }
  .status.delivered { color: #28a745; font-weight: bold; }
  .btn { padding: 5px 10px; background: #0077b6; color: white; border: none; border-radius: 4px; cursor: pointer; }
  .btn:hover { background: #023e8a; }
</style>

<script>
  // دالة لتحديث الحالة
  document.querySelectorAll("#currentOrders .btn").forEach(button => {
    button.addEventListener("click", function() {
      const statusCell = this.closest("tr").querySelector(".status");
      if (statusCell.classList.contains("pending")) {
        statusCell.className = "status onway";
        statusCell.innerText = "🚚 في الطريق";
      } else if (statusCell.classList.contains("onway")) {
        statusCell.className = "status delivered";
        statusCell.innerText = "✅ تم التوصيل";
      } else {
        alert("الطلب منتهي بالفعل ✅");
      }
    });
  });

  // إعادة ترقيم الطلبات يومياً
  function resetOrderNumbers() {
    const today = new Date().toISOString().split("T")[0];
    let storedDate = localStorage.getItem("orderDate");
    if (storedDate !== today) {
      localStorage.setItem("orderDate", today);
      let rows = document.querySelectorAll("#currentOrders tbody tr");
      rows.forEach((row, index) => {
        row.cells[0].innerText = index; // يبدأ من 0 كل يوم
      });
    }
  }
  resetOrderNumbers();
</script>
