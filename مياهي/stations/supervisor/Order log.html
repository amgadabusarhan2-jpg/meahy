<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>سجل الطلبات</title>
  <style>
    body { font-family: Tahoma, sans-serif; direction: rtl; background: #f4f4f4; }
    .container { width: 800px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px #ccc; }
    h2 { text-align: center; color: #0077b6; }
    .filter-box { margin-bottom: 15px; text-align: center; }
    select, input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; margin: 5px; }
    .btn { padding: 8px 15px; background: #0077b6; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #023e8a; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #0077b6; color: white; }
    tr:nth-child(even) { background: #f2f2f2; }
  </style>
</head>
<body>


  <!-- الشريط العلوي -->
<div class="topbar">
  <a href="file:///C:/Users/amjad/مياهي/stations/supervisor/supervisor_home.html">🏠 الرئيسية</a>
  <a href="file:///C:/Users/amjad/مياهي/stations/supervisor/Order%20log.html">📑 سجل الطلبات</a>
  <a href="file:///C:/Users/amjad/مياهي/stations/supervisor/Today's%20inventory.html">📊 جرد اليوم</a>
  <a href="file:///C:/Users/amjad/مياهي/stations/supervisor/Station%20status%20management.html">🏪 حالة المحطة</a>
  <a href="file:///C:/Users/amjad/مياهي/stations/supervisor/clients.html">📅 اشتراكات العملاء</a>
</div>

<style>
  body { margin:0; font-family: Tahoma, sans-serif; direction: rtl; background:#f4f4f4; }
  .topbar {
    background:#0077b6; color:white; padding:10px;
    display:flex; justify-content:space-around;
    position:fixed; top:0; width:100%; z-index:1000;
  }
  .topbar a {
    color:white; text-decoration:none; font-weight:bold;
    padding:8px 12px; transition:0.3s;
  }
  .topbar a:hover {
    background:#023e8a; border-radius:4px;
  }
  .container {
    margin:100px auto; width:90%; background:white;
    padding:20px; border-radius:8px; box-shadow:0 0 10px #ccc;
  }
</style>

  <div class="container">
    <h2>📑 سجل الطلبات للمحطة</h2>

    <!-- فلاتر -->
    <div class="filter-box">
      <label>تصفية حسب الخدمة:</label>
      <select id="serviceFilter">
        <option value="">الكل</option>
        <option value="exchange">تبديل عبوات</option>
        <option value="buy">شراء عبوة</option>
        <option value="machine">شراء ماكينة</option>
      </select>

      <label>تصفية حسب التاريخ:</label>
      <input type="date" id="dateFilter">

      <button class="btn" id="applyFilter">🔍 تطبيق الفلتر</button>
    </div>

    <!-- جدول الطلبات -->
    <table id="ordersTable">
      <thead>
        <tr>
          <th>رقم الطلب</th>
          <th>اسم العميل</th>
          <th>الخدمة</th>
          <th>العدد</th>
          <th>التاريخ</th>
          <th>الحالة</th>
        </tr>
      </thead>
      <tbody>
        <!-- بيانات تجريبية -->
        <tr><td>1001</td><td>أحمد</td><td>تبديل عبوات</td><td>3</td><td>2026-05-12</td><td>تم التوصيل</td></tr>
        <tr><td>1002</td><td>ليلى</td><td>شراء عبوة</td><td>2</td><td>2026-05-12</td><td>قيد التنفيذ</td></tr>
        <tr><td>1003</td><td>سامي</td><td>شراء ماكينة</td><td>1</td><td>2026-05-11</td><td>بانتظار</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    document.getElementById("applyFilter").addEventListener("click", function() {
      const service = document.getElementById("serviceFilter").value;
      const date = document.getElementById("dateFilter").value;
      const rows = document.querySelectorAll("#ordersTable tbody tr");

      rows.forEach(row => {
        const serviceText = row.cells[2].innerText;
        const dateText = row.cells[4].innerText;
        let show = true;

        if (service && !serviceText.includes(service)) show = false;
        if (date && dateText !== date) show = false;

        row.style.display = show ? "" : "none";
      });
    });
  </script>
</body>
</html>
