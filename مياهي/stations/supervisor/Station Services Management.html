<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>سجل الطلبات</title>
  <style>
    body { font-family: Tahoma, sans-serif; direction: rtl; background: #f4f4f4; }
    .container { width: 800px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px #ccc; }
    h2 { text-align: center; color: #0077b6; }
    .filter-box { margin-bottom: 15px; text-align: center; }
    select, input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; margin: 5px; }
    .btn { padding: 8px 15px; background: #0077b6; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #023e8a; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #0077b6; color: white; }
    tr:nth-child(even) { background: #f2f2f2; }
    .time-select { display: inline-flex; align-items: center; gap: 5px; }
    .time-select select { width: 60px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📑 سجل الطلبات للمحطة</h2>

    <!-- فلاتر -->
    <div class="filter-box">
      <label>تصفية حسب الخدمة:</label>
      <select id="serviceFilter">
        <option value="">الكل</option>
        <option value="تبديل عبوات">تبديل عبوات</option>
        <option value="شراء عبوة">شراء عبوة</option>
        <option value="شراء ماكينة">شراء ماكينة</option>
      </select>

      <label>تصفية حسب التاريخ:</label>
      <input type="date" id="dateFilter">

      <button class="btn" id="applyFilter">🔍 تطبيق الفلتر</button>
    </div>

    <!-- جدول الطلبات -->
    <table id="ordersTable">
      <thead>
        <tr>
          <th>رقم الطلب</th>
          <th>اسم العميل</th>
          <th>الخدمة</th>
          <th>العدد</th>
          <th>التاريخ</th>
          <th>الحالة</th>
        </tr>
      </thead>
      <tbody>
        <!-- بيانات تجريبية -->
        <tr><td>1001</td><td>أحمد</td><td>تبديل عبوات</td><td>3</td><td>2026-05-12</td><td>تم التوصيل</td></tr>
        <tr><td>1002</td><td>ليلى</td><td>شراء عبوة</td><td>2</td><td>2026-05-12</td><td>قيد التنفيذ</td></tr>
        <tr><td>1003</td><td>سامي</td><td>شراء ماكينة</td><td>1</td><td>2026-05-11</td><td>بانتظار</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    document.getElementById("applyFilter").addEventListener("click", function() {
      const service = document.getElementById("serviceFilter").value;
      const date = document.getElementById("dateFilter").value;
      const rows = document.querySelectorAll("#ordersTable tbody tr");

      rows.forEach(row => {
        const serviceText = row.cells[2].innerText.trim();
        const dateText = row.cells[4].innerText.trim();
        let show = true;

        if (service && serviceText !== service) show = false;
        if (date && dateText !== date) show = false;

        row.style.display = show ? "" : "none";
      });
    });
  </script>
</body>
</html>
