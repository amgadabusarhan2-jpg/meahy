<head>
  <meta charset="UTF-8">
  <title>إدارة الموظفين</title>
  <style>
    body { font-family: Tahoma, sans-serif; direction: rtl; background: #f4f4f4; }
    .container { width: 600px; margin: 50px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px #ccc; }
    h2 { text-align: center; color: #0077b6; }
    label { display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
    .btn { padding: 8px 15px; margin-top: 15px; background: #0077b6; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #023e8a; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background: #0077b6; color: white; }
    tr:nth-child(even) { background: #f2f2f2; }
  </style>
</head>
<body>
  <div class="container">
    <h2>👥 إدارة الموظفين</h2>
    <form id="employeeForm">
      <label>نوع الموظف:</label>
      <select id="role">
        <option value="">اختر النوع</option>
        <option value="driver">سائق</option>
        <option value="worker">عامل</option>
      </select>

      <label>رقم الهاتف:</label>
      <input type="text" id="phone" placeholder="أدخل رقم الهاتف">

      <label>كلمة المرور:</label>
      <input type="password" id="password" placeholder="أدخل كلمة المرور">

      <button type="submit" class="btn">➕ إضافة الموظف</button>
    </form>

    <!-- جدول الموظفين -->
    <table id="employeesTable">
      <thead>
        <tr>
          <th>النوع</th>
          <th>رقم الهاتف</th>
          <th>كلمة المرور</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody>
        <!-- موظفين تجريبيين -->
        <tr>
          <td>سائق</td>
          <td>0791234567</td>
          <td>pass123</td>
          <td>
            <button class="btn edit">تعديل كلمة المرور</button>
            <button class="btn delete">حذف</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById("employeeForm");
    const table = document.getElementById("employeesTable").querySelector("tbody");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const role = document.getElementById("role").value;
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value.trim();

      if (role === "" || phone === "" || password === "") {
        alert("⚠️ الرجاء تعبئة جميع الحقول");
        return;
      }
      if (!/^[0-9]{10}$/.test(phone)) {
        alert("⚠️ رقم الهاتف يجب أن يكون 10 أرقام");
        return;
      }

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${role === "driver" ? "سائق" : "عامل"}</td>
        <td>${phone}</td>
        <td>${password}</td>
        <td>
          <button class="btn edit">تعديل كلمة المرور</button>
          <button class="btn delete">حذف</button>
        </td>
      `;
      table.appendChild(row);

      form.reset();

      // إضافة أحداث الأزرار
      row.querySelector(".delete").addEventListener("click", function() {
        row.remove();
      });

      row.querySelector(".edit").addEventListener("click", function() {
        const newPass = prompt("أدخل كلمة مرور جديدة:");
        if (newPass && newPass.trim() !== "") {
          row.cells[2].innerText = newPass;
          alert("✅ تم تعديل كلمة المرور بنجاح");
        }
      });
    });

    // أحداث للموظفين التجريبيين
    document.querySelectorAll(".delete").forEach(button => {
      button.addEventListener("click", function() {
        this.closest("tr").remove();
      });
    });

    document.querySelectorAll(".edit").forEach(button => {
      button.addEventListener("click", function() {
        const row = this.closest("tr");
        const newPass = prompt("أدخل كلمة مرور جديدة:");
        if (newPass && newPass.trim() !== "") {
          row.cells[2].innerText = newPass;
          alert("✅ تم تعديل كلمة المرور بنجاح");
        }
      });
    });
  </script>
</body>
