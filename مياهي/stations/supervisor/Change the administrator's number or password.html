<head>
  <meta charset="UTF-8">
  <title>مصادقة المشرف</title>
  <style>
    body { font-family: Tahoma, sans-serif; direction: rtl; background:#f4f4f4; }
    .container { width: 400px; margin: 50px auto; background:white; padding:20px; border-radius:8px; box-shadow:0 0 10px #ccc; }
    h2 { text-align:center; color:#0077b6; }
    label { display:block; margin-top:10px; font-weight:bold; }
    input { width:100%; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:4px; }
    .btn { width:100%; padding:10px; margin-top:15px; background:#0077b6; color:white; border:none; border-radius:4px; cursor:pointer; }
    .btn:hover { background:#023e8a; }
    .message { margin-top:15px; text-align:center; font-weight:bold; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📲 مصادقة المشرف</h2>
    <label>أدخل رقم الهاتف:</label>
    <input type="text" id="phone" placeholder="مثال: 962791234567">

    <button class="btn" onclick="sendCode()">إرسال رمز المصادقة</button>

    <div id="codeSection" style="display:none;">
      <label>أدخل الرمز:</label>
      <input type="text" id="otp" placeholder="رمز المصادقة">
      <button class="btn" onclick="verifyCode()">تأكيد</button>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script>
    let generatedCode = "";

    function sendCode() {
      const phone = document.getElementById("phone").value.trim();
      if (!phone) {
        document.getElementById("message").innerText = "❌ أدخل رقم الهاتف أولاً";
        return;
      }
      // توليد رمز عشوائي (مثال)
      generatedCode = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById("message").innerText = "✅ تم إرسال رمز المصادقة إلى هاتفك: " + generatedCode;
      document.getElementById("codeSection").style.display = "block";
    }

    function verifyCode() {
      const otp = document.getElementById("otp").value.trim();
      if (otp === generatedCode) {
        window.location.href = "file:///C:/Users/amjad/%D9%85%D9%8A%D8%A7%D9%87%D9%8A/stations/supervisor/Change%20the%20administrator's%20username%20or%20password%20after%20authentication.html"; // الانتقال للصفحة الثانية
      } else {
        document.getElementById("message").innerText = "❌ الرمز غير صحيح";
      }
    }
  </script>
</body>
