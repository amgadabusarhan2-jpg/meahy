<div class="container">
  <h2>📅 حالة اشتراك المحطات</h2>
  <table>
    <thead>
      <tr>
        <th>اسم المحطة</th>
        <th>تاريخ بداية الاشتراك</th>
        <th>تاريخ الانتهاء</th>
        <th>الأيام المتبقية</th>
        <th>إجراء</th>
      </tr>
    </thead>
    <tbody id="subscriptions">
      <!-- مثال -->
      <tr>
        <td>محطة اليرموك</td>
        <td>2026-05-01</td>
        <td>2026-06-01</td>
        <td class="days-left"></td>
        <td><button class="btn" onclick="contactOwner()">📲 تواصل</button></td>
      </tr>
    </tbody>
  </table>
</div>

<style>
  .btn { padding: 5px 10px; background: #0077b6; color: white; border: none; border-radius: 4px; cursor: pointer; }
  .btn:hover { background: #023e8a; }
  .warning { color: #dc3545; font-weight: bold; }
</style>

<script>
  // رقمك المخزن هنا
  const ownerPhone = "962778858932"; // لازم يكون بصيغة دولية بدون صفر بالبداية

  function contactOwner() {
    const message = "⚠️ تبقى أقل من 5 أيام لانتهاء الاشتراك، الرجاء تجديد الاشتراك.";
    const url = `https://wa.me/${ownerPhone}?text=${encodeURIComponent(message)}`;
    window.open(url, "_blank");
  }

  // حساب الأيام المتبقية
  document.querySelectorAll("#subscriptions tr").forEach(row => {
    const startDate = new Date(row.cells[1].innerText);
    const endDate = new Date(row.cells[2].innerText);
    const today = new Date();
    const diffTime = endDate - today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    row.cells[3].innerText = diffDays + " يوم";

    if (diffDays <= 5) {
      row.cells[3].classList.add("warning");
      row.cells[3].innerText = `⚠️ تبقى ${diffDays} أيام`;
    }
  });
</script>
