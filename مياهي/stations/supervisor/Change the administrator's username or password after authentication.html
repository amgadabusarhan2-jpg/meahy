<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>إعدادات المشرف</title>
  <style>
    body { font-family: Tahoma, sans-serif; direction: rtl; background:#f4f4f4; margin:0; }
    .topbar {
      background:#0077b6; color:white; padding:10px;
      display:flex; justify-content:space-around;
      position:fixed; top:0; width:100%; z-index:1000;
    }
    .topbar a {
      color:white; text-decoration:none; font-weight:bold;
      padding:8px 12px; transition:0.3s;
    }
    .topbar a:hover { background:#023e8a; border-radius:4px; }
    .container {
      margin:100px auto; width:400px; background:white;
      padding:20px; border-radius:8px; box-shadow:0 0 10px #ccc;
    }
    h2 { text-align:center; color:#0077b6; }
    label { display:block; margin-top:10px; font-weight:bold; }
    input { width:100%; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:4px; }
    .btn { width:100%; padding:10px; margin-top:15px; background:#0077b6; color:white; border:none; border-radius:4px; cursor:pointer; }
    .btn:hover { background:#023e8a; }
    .message { margin-top:15px; text-align:center; font-weight:bold; }
  </style>
</head>
<body>

<!-- الشريط العلوي -->
<div class="topbar">
  <a href="file:///C:/Users/amjad/مياهي/stations/supervisor/supervisor_home.html">🏠 الرئيسية</a>
  <a href="file:///C:/Users/amjad/%D9%85%D9%8A%D8%A7%D9%87%D9%8A/stations/supervisor/Add%20services%20from%20the%20administrator.html">⚙️ إدارة خدمات المحطة</a>
  <a href="file:///C:/Users/amjad/%D9%85%D9%8A%D8%A7%D9%87%D9%8A/stations/supervisor/Registration%20page%20(for%20administrators).html">📅 حالة اشتراك المحطات</a>
  <a href="file:///C:/Users/amjad/%D9%85%D9%8A%D8%A7%D9%87%D9%8A/stations/supervisor/Employee%20Management%20Screen.html">👥 إدارة الموظفين</a>
  <a href="file:///C:/Users/amjad/%D9%85%D9%8A%D8%A7%D9%87%D9%8A/stations/supervisor/Employee%20page%20+%20ratings.html">👥 الموظفين وتقييمهم</a>
  <a href="file:///C:/Users/amjad/%D9%85%D9%8A%D8%A7%D9%87%D9%8A/stations/supervisor/Change%20the%20administrator's%20number%20or%20password.html">🔑 تغيير رقم المشرف / كلمة المرور</a>
</div>

  <!-- المحتوى -->
  <div class="container">
    <h2>⚙️ إعدادات المشرف</h2>

    <!-- تغيير اسم المحطة -->
    <label>اسم المحطة الجديد:</label>
    <input type="text" id="newStationName" placeholder="أدخل اسم المحطة الجديد">
    <button class="btn" onclick="updateStationName()">🏪 تحديث اسم المحطة</button>

    <!-- تغيير رقم الهاتف -->
    <label>رقم الهاتف الجديد:</label>
    <input type="text" id="newPhone" placeholder="أدخل الرقم الجديد">
    <button class="btn" onclick="updatePhone()">📲 تحديث الرقم</button>

    <!-- تغيير كلمة المرور -->
    <label>كلمة المرور الجديدة:</label>
    <input type="password" id="newPassword" placeholder="أدخل كلمة المرور الجديدة">

    <label>تأكيد كلمة المرور الجديدة:</label>
    <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور الجديدة">

    <button class="btn" onclick="updatePassword()">🔑 تحديث كلمة المرور</button>

    <div id="message" class="message"></div>
  </div>

  <script>
    function updateStationName() {
      const newStationName = document.getElementById("newStationName").value.trim();
      if (!newStationName) {
        document.getElementById("message").innerText = "❌ أدخل اسم المحطة الجديد";
        return;
      }
      document.getElementById("message").innerText = "✅ تم تحديث اسم المحطة إلى: " + newStationName;
    }

    function updatePhone() {
      const newPhone = document.getElementById("newPhone").value.trim();
      if (!newPhone) {
        document.getElementById("message").innerText = "❌ أدخل الرقم الجديد";
        return;
      }
      document.getElementById("message").innerText = "✅ تم تحديث رقم الهاتف إلى: " + newPhone;
    }

    function updatePassword() {
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      if (!newPassword || !confirmPassword) {
        document.getElementById("message").innerText = "❌ أدخل كلمة المرور الجديدة";
        return;
      }
      if (newPassword !== confirmPassword) {
        document.getElementById("message").innerText = "❌ كلمة المرور غير متطابقة";
        return;
      }
      document.getElementById("message").innerText = "✅ تم تحديث كلمة المرور بنجاح";
    }
  </script>
</body>
</html>
