<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>العميل - الطلب</title>
  <style>
    body { font-family: Tahoma, sans-serif; direction: rtl; background: #f4f4f4; }
    .container { width: 400px; margin: 50px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px #ccc; }
    h2 { text-align: center; color: #0077b6; }
    label { display: block; margin-top: 10px; }
    select, input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
    .btn { width: 100%; padding: 10px; margin-top: 15px; background: #0077b6; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #023e8a; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🚰 طلب خدمة</h2>
    <form id="orderForm">
      <label>اختر الخدمة:</label>
      <select id="service">
        <option value="">اختر الخدمة</option>
        <option value="exchange">تبديل عبوات ماء</option>
        <option value="buy">شراء عبوة ماء ممتلئة</option>
        <option value="machine">شراء ماكينة فلتر/كولر</option>
      </select>

      <label>عدد العبوات / الأجهزة:</label>
      <input type="number" id="quantity" min="1" placeholder="أدخل العدد">

      <button type="submit" class="btn">إرسال الطلب</button>
    </form>
  </div>

  <script>
    document.getElementById("orderForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const service = document.getElementById("service").value;
      const quantity = document.getElementById("quantity").value;

      if (service === "" || quantity === "" || quantity <= 0) {
        alert("⚠️ الرجاء اختيار الخدمة وإدخال العدد بشكل صحيح");
        return;
      }

      alert("✅ تم إرسال الطلب: " + service + " × " + quantity);
    });
  </script>
</body>
</html>
